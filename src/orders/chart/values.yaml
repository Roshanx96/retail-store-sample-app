# Default values for orders.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
# This is a Helm values.yaml file for deploying the Orders microservice of the AWS Retail Store sample app.

replicaCount: 1                          # 👉 Creates 1 pod of the Orders service.
image:
  repository: public.ecr.aws/aws-containers/retail-store-sample-orders
  pullPolicy: Always
  tag: "1.2.2"
imagePullSecrets:                       # 👉 Kubernetes will use a secret named regcred to pull the image.
  - name: regcred
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
podAnnotations: {}
podSecurityContext:
  fsGroup: 1000
securityContext:
  capabilities:                    #✅ Drops all Linux capabilities
    drop:
      - ALL
  readOnlyRootFilesystem: true     #✅ Read-only root filesystem                 
  runAsNonRoot: true               #✅ Runs as non-root user
  runAsUser: 1000                  
service:
  type: ClusterIP
  port: 80
resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 256m
    memory: 512Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
metrics:
  enabled: true
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
configMap:                              # create a ConfigMap for application configuration.
  create: true
  name:
# this section controls how the Orders service stores data and sends messages.
#   persistence   → database
#   messaging     → message broker
#   👉 It will NOT create a database, RabbitMQ. It only uses in-memory storage

#It runs:
#🧠 In-memory database (inside the Orders container) 🧠 In-memory messaging (inside the same container)
#So everything lives only in RAM. If the pod restarts → all data is lost.

app:
  persistence:
    provider: 'in-memory'
    endpoint: ''
    database: 'orders'
    secret:                           # 👉 Create a Kubernetes Secret for DB credentials.
      create: true
      name: orders-db
      username: orders
      password: ""
  messaging:
    provider: 'in-memory'
    rabbitmq:
      addresses: []
      secret:
        create: true
        name: orders-rabbitmq
        username: ""
        password: ""
postgresql:                         # ❌ No PostgreSQL pod created
  create: false
  image:
    repository: public.ecr.aws/docker/library/postgres
    pullPolicy: IfNotPresent
    tag: "13"
  service:
    type: ClusterIP
    port: 5432
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  persistentVolume:                # ❌ No persistent storage
    enabled: false
    annotations: {}
    labels: {}
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    # storageClass: gp2
rabbitmq:
  create: false
  image:
    repository: public.ecr.aws/docker/library/rabbitmq
    pullPolicy: IfNotPresent
    tag: "3.8-management"
  service:
    type: ClusterIP
    amqp:
      port: 5672
    http:
      port: 15672
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  persistentVolume:
    enabled: false
    annotations: {}
    labels: {}
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    # storageClass: gp2
securityGroups:
  create: false
  securityGroupIds: []
opentelemetry:
  enabled: false
  instrumentation: ""
podDisruptionBudget:
  enabled: false
  minAvailable: 2
  maxUnavailable: 1


# 👉 To create PostgreSQL:
#    You must set:

# postgresql:
#   create: true

# And change:

# persistence:
#   provider: postgresql


# 👉 To create RabbitMQ:
#    You must set:

# rabbitmq:
#   create: true

# And change:

# messaging:
#   provider: rabbitmq
