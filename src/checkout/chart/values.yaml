# Default values for checkout.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
# This is the Helm values.yaml for the Checkout microservice of the AWS Retail Store sample app.

replicaCount: 1
image:
  repository: public.ecr.aws/aws-containers/retail-store-sample-checkout
  pullPolicy: Always
  tag: "1.2.2"
imagePullSecrets:
  - name: regcred
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''
podAnnotations: {}
podSecurityContext:
  fsGroup: 1000
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
service:
  type: ClusterIP
  port: 80
resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 128m
    memory: 256Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
metrics:                               # 👉 It tells Prometheus to scrape (pull) metrics from the pod.
  enabled: true
  podAnnotations:
    prometheus.io/scrape: 'true'      # “Yes, you should scrape this pod.”
    prometheus.io/port: '8080'        # “Metrics are exposed on port 8080.”
    prometheus.io/path: '/metrics'    # “The metrics endpoint is available at /metrics.”
configMap:
  create: true
  name:
# Everything is stored inside container memory. || If pod restart data lost.
app:
  persistence:
    provider: 'in-memory'                            #👉 If you wanted Redis, you'd need  "provider: redis"
    redis:
      endpoint: ''
  endpoints:
    orders: http://retail-store-orders:80
redis:                                               #👉 If you wanted Redis, you'd need  "create: true"
  create: false
  image:
    repository: public.ecr.aws/docker/library/redis
    pullPolicy: IfNotPresent
    tag: "6.0-alpine"
  service:
    type: ClusterIP
    port: 6379
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
securityGroups:
  create: false
  securityGroupIds: []
opentelemetry:
  enabled: false
  instrumentation: ''
podDisruptionBudget:
  enabled: false
  minAvailable: 2
  maxUnavailable: 1
