# Default values for catalog.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
# This is the Helm values.yaml for the Catalog microservice of the AWS Retail Store sample app.

replicaCount: 1

image:
  repository: public.ecr.aws/aws-containers/retail-store-sample-catalog
  pullPolicy: Always
  tag: "1.2.2"

imagePullSecrets:
  - name: regcred

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # If not set and create is true, a name is generated automatically
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000   # Ensures mounted volumes are owned by group 1000

securityContext:
  capabilities:
    drop:
      - ALL       # Drop all Linux capabilities for security hardening
  readOnlyRootFilesystem: true   # Prevents writing to container root filesystem
  runAsNonRoot: true             # Forces container to run as non-root
  runAsUser: 1000                # Runs container as user ID 1000

service:
  type: ClusterIP   # Internal service only (not publicly exposed)
  port: 80

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 256m
    memory: 256Mi

autoscaling:
  enabled: false     # Horizontal Pod Autoscaler disabled
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

metrics:   # 👉 Enables Prometheus scraping (pull model)
  enabled: true
  podAnnotations:
    prometheus.io/scrape: "true"     # “Yes, scrape this pod.”
    prometheus.io/port: "8080"       # Metrics exposed on port 8080
    prometheus.io/path: "/metrics"   # Metrics endpoint path

configMap:
  create: true
  name:

# Everything is stored in container memory unless MySQL is enabled.
# If pod restarts and using in-memory → data is lost.

app:
  persistence:
    provider: in-memory     # 👉 To use MySQL, change to "provider: mysql"
    endpoint: ""
    database: "catalog"
    secret:
      create: true          # Creates Kubernetes Secret for DB credentials
      name: catalog-db
      username: catalog
      password: ""

mysql:                      # 👉 To create MySQL, set create: true
  create: false             # Currently NO MySQL will be created
  image:
    repository: public.ecr.aws/docker/library/mysql
    pullPolicy: IfNotPresent
    tag: "8.0"
  service:
    type: ClusterIP
    port: 3306
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  persistentVolume:
    enabled: false          # No persistent storage unless enabled
    annotations: {}
    labels: {}
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClass: ""

securityGroups:
  create: false
  securityGroupIds: []

opentelemetry:
  enabled: false            # Distributed tracing disabled
  instrumentation: ""

podDisruptionBudget:
  enabled: false            # No PDB protection
  minAvailable: 2
  maxUnavailable: 1
