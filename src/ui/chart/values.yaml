# ✅ 1️⃣ Deployment
# 1 UI Pod will run

# ✅ 2️⃣ Service (ClusterIP)
# This makes the UI accessible inside the cluster on port 80.

# ✅ 3️⃣ ServiceAccount

# ✅ 4️⃣ ConfigMap

# ❌ 5️⃣ Ingress (Important)
# ❌ It will NOT create the main ingress block.

# ✅ 6️⃣ ClusterIssuer (Cert Manager)
# Let’s Encrypt production server

# ❌ 7️⃣ Autoscaling
# ❌ No HorizontalPodAutoscaler created.
   
# ❌ 8️⃣ Istio
#  ❌ No VirtualService
#  ❌ No Gateway                                                                                                                                                                                                                         

# 🧠 Final List of What Gets Created
# Core Resources:

# ✔ Deployment
# ✔ 1 Pod
# ✔ Service (ClusterIP)
# ✔ ServiceAccount
# ✔ ConfigMap
# ✔ Possibly 2 Ingress resources
# ✔ ClusterIssuer (cert-manager)

# Default values for ui.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
image:
  repository: public.ecr.aws/aws-containers/retail-store-sample-ui
  pullPolicy: Always
  tag: "1.2.2"
imagePullSecrets:
  - name: regcred
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
podAnnotations: {}
podSecurityContext:                      # It controls how the Pod and container run at OS level (Linux permissions, users, capabilities).
  fsGroup: 1000                          # Run my container as user 1000, not root
securityContext:                         # Remove all extra privileges.
  capabilities:                          # Only allow binding to port 80. 
    drop:                                # Make filesystem read-only.
      - ALL
    add:
      - NET_BIND_SERVICE
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
service:
  type: ClusterIP
  port: 80
  # annotations: {}
  # loadBalancerClass: ""
  # nodePort: 30000
resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 128m
    memory: 512Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
metrics:
  enabled: true
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
configMap:
  create: true
  name: # if blank this will be generated

#  This section defines the backend service endpoints that your UI application will call inside the Kubernetes cluster.

#    User
#     ↓
#  NGINX Ingress
#     ↓
#   UI Pod
#     ↓
#   UI calls:
#    → retail-store-catalog
#    → retail-store-cart-carts
#    → retail-store-orders
#    → retail-store-checkout
app:
  # theme: default
  endpoints:
    catalog: http://retail-store-catalog:80
    carts: http://retail-store-cart-carts:80
    orders: http://retail-store-orders:80
    checkout: http://retail-store-checkout:80
  chat:
    enabled: false
    provider: ""
    model: ""
    # temperature: 0.7
    # maxTokens: 300
    # prompt: |
    #   This will override the default system prompt
    bedrock:
      region: ""
    openai:
      baseUrl: ""
      # apiKey: ""
## Ingress for NGINX Ingress Controller
ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
  tls: []
  hosts: []
ingresses:
  # Direct ELB access - no host restriction
  - name: direct
    className: "nginx"
    hosts: []
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
      nginx.ingress.kubernetes.io/proxy-body-size: "8m"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    tls: []
  # Domain-based access with SSL
  - name: domain
    className: "nginx"
    hosts:
      - retail-store.trainwithshubham.com
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/proxy-body-size: "8m"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    tls:
      - secretName: tls-secret
        hosts:
          - retail-store.trainwithshubham.com

# Cert Manager Configuration
# This section configures cert-manager to automatically issue SSL certificates using Let’s Encrypt (production environment).
# cert-manager is a Kubernetes add-on that: Automatically requests SSL certificates, Renews certificates before expiry, Stores them as Kubernetes Secrets, Works with Ingress
# In Simple words: Create a Let’s Encrypt production issuer using this email and ACME server, and store the account key in a secret.

certManager:
  createClusterIssuer: true
  email: trainwithshubham@gmail.com
  clusterIssuerName: "letsencrypt-prod"
  server: "https://acme-v02.api.letsencrypt.org/directory"
  privateKeySecretName: "letsencrypt-prod-key"
istio:
  enabled: false
  hosts: []
opentelemetry:
  enabled: false
  instrumentation: ""
podDisruptionBudget:
  enabled: false
  minAvailable: 2
  maxUnavailable: 1
