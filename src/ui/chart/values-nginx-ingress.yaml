# This YAML file for deploying a retail-store UI application on Kubernetes using the NGINX Ingress Controller and cert-manager.
# 📦 Final Summary – What Will Be Created

# ✅ Core App Resources
# 1 Pod
# 1 Deployment
# 1 ServiceAccount (retail-store-ui-sa)
# 1 ClusterIP Service

# 🌍 Networking
# 1 Ingress (NGINX based)
# Domain routing: retail-store.iemafzalhassan.in
# HTTPS enabled
# HTTP → HTTPS redirect

# 🔐 Security
# 1 TLS Secret (retail-store-tls)
# 1 ClusterIssuer (letsencrypt-prod)
# Automatic Let's Encrypt certificate

# 📊 Monitoring
# Prometheus scrape annotations



# Custom values for UI with NGINX Ingress Controller
# Creates 1 Pod of your retail-store UI application.
replicaCount: 1

# Service Account Configuration
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "retail-store-ui-sa"  # Using a different name to avoid conflicts

service:
  type: ClusterIP
  port: 80

# NGINX Ingress Configuration
# This creates a Kubernetes Ingress resource handled by:
# 👉 NGINX Ingress Controller
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    # Basic proxy headers using individual annotations
    nginx.ingress.kubernetes.io/proxy-set-header: "X-Real-IP $remote_addr"
    # Cert-manager annotations
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - retail-store.iemafzalhassan.in                    # When someone visits: https://retail-store.iemafzalhassan.in Traffic will route to your UI service.
  tls:                                                  # enables HTTPS for the domain.
    - hosts:
        - retail-store.iemafzalhassan.in
      secretName: retail-store-tls

# Application configuration
# Your UI connects internally to: catalog service | carts service |  checkout service |  orders service
# These must already exist as Kubernetes services.
app:
  endpoints:
    catalog: http://catalog:80
    carts: http://carts:80
    checkout: http://checkout:80
    orders: http://orders:80

# Resources
resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 128m
    memory: 512Mi

# Metrics
# This Allows: 👉 Prometheus to scrape metrics from
metrics:
  enabled: true
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"

# Cert Manager Configuration
certManager:
  createClusterIssuer: true
  email: iemafzalhassan@gmail.com
  clusterIssuerName: "letsencrypt-prod"
  server: "https://acme-v02.api.letsencrypt.org/directory"
  privateKeySecretName: "letsencrypt-prod-key" 
